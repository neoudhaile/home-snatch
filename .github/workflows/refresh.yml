name: refresh

# Lightweight maintenance pass — re-fetches stale listings to detect "gone"
# markers and updates last_seen_at + photo diffs. Cheaper than a full scrape;
# runs more often.

on:
  schedule:
    # every hour at :15
    - cron: '15 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/refresh.ts
